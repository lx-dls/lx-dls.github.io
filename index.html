<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRASH DLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f0a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #1e1233;
            padding: 40px 35px;
            border-radius: 24px;
            border: 1px solid #6a3f9e;
            box-shadow: 0 0 60px rgba(106, 63, 158, 0.25);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            color: #b78cf5;
            margin-bottom: 6px;
        }

        .sub {
            color: #8b7aa8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* ===== НОВОСТЬ ===== */
        .news-box {
            background: #120b1f;
            border-radius: 16px;
            padding: 30px 25px;
            border: 2px dashed #6a3f9e;
            margin-bottom: 20px;
        }

        .news-box .icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }

        .news-box h2 {
            color: #b78cf5;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .news-box p {
            color: #8b7aa8;
            font-size: 14px;
            line-height: 1.6;
        }

        .news-box .date {
            color: #5a4a72;
            font-size: 12px;
            margin-top: 12px;
            display: block;
        }

        /* ===== КНОПКИ ===== */
        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: #6a3f9e;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn:hover {
            background: #8b5fcf;
            transform: scale(1.02);
        }

        .btn-green {
            background: #2ecc71;
        }
        .btn-green:hover {
            background: #27ae60;
        }

        .btn-gold {
            background: #f39c12;
        }
        .btn-gold:hover {
            background: #e67e22;
        }

        .btn-locked {
            background: #3a2852;
            color: #6a5a7a;
            cursor: not-allowed;
            opacity: 0.6;
            pointer-events: none;
        }
        .btn-locked::after {
            content: " 🔒";
            color: #6a5a7a;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }

        /* ===== СТАТУС ===== */
        .status {
            color: #5a4a72;
            font-size: 13px;
            margin-top: 15px;
        }
        .status .online {
            color: #2ecc71;
        }

        /* ===== ССЫЛКИ ===== */
        .links {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .links a {
            color: #b78cf5;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid #6a3f9e;
            transition: 0.3s;
        }
        .links a:hover {
            background: #6a3f9e;
            color: #fff;
        }

        .footer {
            color: #5a4a72;
            font-size: 13px;
            margin-top: 20px;
        }

        /* ===== МОДАЛКА ВХОДА ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1e1233;
            padding: 35px 30px;
            border-radius: 24px;
            border: 1px solid #6a3f9e;
            max-width: 400px;
            width: 100%;
            margin: 20px;
        }

        .modal h2 {
            color: #b78cf5;
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }

        .modal .form-group {
            margin-bottom: 15px;
        }

        .modal .form-group label {
            display: block;
            color: #8b7aa8;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .modal .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #3a2852;
            background: #120b1f;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .modal .form-group input:focus {
            border-color: #8b5fcf;
        }

        .modal .btn-close {
            background: #e74c3c;
            margin-top: 10px;
        }
        .modal .btn-close:hover {
            background: #c0392b;
        }

        .modal .switch {
            text-align: center;
            margin-top: 12px;
            color: #8b7aa8;
            font-size: 14px;
        }
        .modal .switch a {
            color: #b78cf5;
            cursor: pointer;
            font-weight: 600;
        }

        .modal #modalMsg {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
            min-height: 22px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🚀 CRASH DLC</h1>
    <div class="sub">Установи клиент и участвуй в бета-тесте</div>

    <!-- ===== НОВОСТЬ ===== -->
    <div class="news-box">
        <span class="icon">⚙️</span>
        <h2>В разработке</h2>
        <p>
            Мы работаем над новой версией CRASH DLC.<br>
            Добавляем уникальные функции и улучшаем анти-бан.
        </p>
        <span class="date">📅 30 августа 2026</span>
    </div>

    <!-- ===== КНОПКИ ===== -->
    <div class="btn-group">
        <button class="btn" onclick="openModal()">🔑 Войти</button>
        <button class="btn btn-locked">🛒 Купить бету 1.21.11</button>
    </div>

    <!-- ===== СТАТУС ===== -->
    <div class="status">
        <span class="online">●</span> Сервер: <span class="online">онлайн</span>
    </div>

    <!-- ===== ССЫЛКИ ===== -->
    <div class="links">
        <a href="https://discord.gg/DanFgwuyd" target="_blank">💬 Discord</a>
        <a href="https://t.me/crashDLC" target="_blank">📲 Telegram</a>
    </div>

    <div class="footer">© 2026 CRASH DLC</div>

</div>

<!-- ===== МОДАЛКА ВХОДА ===== -->
<div class="modal-overlay" id="loginModal">
    <div class="modal">
        <h2 id="modalTitle">🔐 Вход</h2>

        <div id="modalLogin">
            <div class="form-group">
                <label>👤 Логин</label>
                <input type="text" id="modalLoginName" placeholder="Введите логин">
            </div>
            <div class="form-group">
                <label>🔑 Пароль</label>
                <input type="password" id="modalLoginPass" placeholder="Введите пароль">
            </div>
            <button class="btn" onclick="modalLogin()">Войти</button>
            <div class="switch">Нет аккаунта? <a onclick="modalShowRegister()">Зарегистрируйся</a></div>
        </div>

        <div id="modalRegister" class="hidden">
            <div class="form-group">
                <label>👤 Логин</label>
                <input type="text" id="modalRegName" placeholder="Придумай логин">
            </div>
            <div class="form-group">
                <label>📧 Почта</label>
                <input type="email" id="modalRegEmail" placeholder="Введи почту">
            </div>
            <div class="form-group">
                <label>🔑 Пароль</label>
                <input type="password" id="modalRegPass" placeholder="Придумай пароль">
            </div>
            <div class="form-group">
                <label>🔁 Повтори пароль</label>
                <input type="password" id="modalRegPass2" placeholder="Повтори пароль">
            </div>
            <button class="btn btn-green" onclick="modalRegister()">Зарегистрироваться</button>
            <div class="switch">Уже есть аккаунт? <a onclick="modalShowLogin()">Войти</a></div>
        </div>

        <div id="modalMsg"></div>
        <button class="btn btn-close" onclick="closeModal()">✖ Закрыть</button>
    </div>
</div>

<script>
    // =======================================================
    // ===== МОДАЛКА =====
    // =======================================================

    function openModal() {
        document.getElementById('loginModal').classList.add('active');
        document.getElementById('modalMsg').textContent = '';
        modalShowLogin();
    }

    function closeModal() {
        document.getElementById('loginModal').classList.remove('active');
    }

    function modalShowLogin() {
        document.getElementById('modalLogin').classList.remove('hidden');
        document.getElementById('modalRegister').classList.add('hidden');
        document.getElementById('modalTitle').textContent = '🔐 Вход';
        document.getElementById('modalMsg').textContent = '';
    }

    function modalShowRegister() {
        document.getElementById('modalLogin').classList.add('hidden');
        document.getElementById('modalRegister').classList.remove('hidden');
        document.getElementById('modalTitle').textContent = '📝 Регистрация';
        document.getElementById('modalMsg').textContent = '';
    }

    // =======================================================
    // ===== ДАННЫЕ =====
    // =======================================================

    function getUsers() {
        return JSON.parse(localStorage.getItem('users') || '[]');
    }

    function saveUsers(users) {
        localStorage.setItem('users', JSON.stringify(users));
    }

    // =======================================================
    // ===== РЕГИСТРАЦИЯ =====
    // =======================================================

    function modalRegister() {
        const name = document.getElementById('modalRegName').value.trim();
        const email = document.getElementById('modalRegEmail').value.trim();
        const pass = document.getElementById('modalRegPass').value;
        const pass2 = document.getElementById('modalRegPass2').value;
        const msg = document.getElementById('modalMsg');

        if (!name || !email || !pass || !pass2) {
            msg.textContent = '❌ Заполни все поля!';
            msg.style.color = '#e74c3c';
            return;
        }
        if (pass.length < 4) {
            msg.textContent = '❌ Пароль минимум 4 символа!';
            msg.style.color = '#e74c3c';
            return;
        }
        if (pass !== pass2) {
            msg.textContent = '❌ Пароли не совпадают!';
            msg.style.color = '#e74c3c';
            return;
        }

        const users = getUsers();
        if (users.find(u => u.name === name)) {
            msg.textContent = '❌ Такой логин уже занят!';
            msg.style.color = '#e74c3c';
            return;
        }

        users.push({
            name: name,
            email: email,
            password: pass,
            date: new Date().toLocaleDateString('ru-RU')
        });
        saveUsers(users);

        msg.textContent = '✅ Регистрация успешна! Теперь войди.';
        msg.style.color = '#2ecc71';

        setTimeout(() => {
            document.getElementById('modalLoginName').value = name;
            modalShowLogin();
            msg.textContent = '';
        }, 1500);
    }

    // =======================================================
    // ===== ВХОД =====
    // =======================================================

    function modalLogin() {
        const name = document.getElementById('modalLoginName').value.trim();
        const pass = document.getElementById('modalLoginPass').value.trim();
        const msg = document.getElementById('modalMsg');

        if (!name || !pass) {
            msg.textContent = '❌ Заполни все поля!';
            msg.style.color = '#e74c3c';
            return;
        }

        const users = getUsers();
        const user = users.find(u => u.name === name && u.password === pass);

        if (user) {
            localStorage.setItem('currentUser', JSON.stringify(user));
            msg.textContent = '✅ Добро пожаловать, ' + name + '!';
            msg.style.color = '#2ecc71';
            setTimeout(() => {
                closeModal();
                // Можно что-то сделать после входа
            }, 1000);
        } else {
            msg.textContent = '❌ Неверный логин или пароль!';
            msg.style.color = '#e74c3c';
        }
    }

    // =======================================================
    // ===== ENTER =====
    // =======================================================

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            if (!document.getElementById('loginModal').classList.contains('active')) return;

            if (!document.getElementById('modalLogin').classList.contains('hidden')) {
                modalLogin();
            } else {
                modalRegister();
            }
        }

        if (e.key === 'Escape') {
            closeModal();
        }
    });

    // =======================================================
    // ===== КЛИК ВНЕ МОДАЛКИ =====
    // =======================================================

    document.getElementById('loginModal').addEventListener('click', function(e) {
        if (e.target === this) {
            closeModal();
        }
    });
</script>

</body>
</html>
