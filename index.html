<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRASH DLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f0a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #1e1233;
            padding: 40px 35px;
            border-radius: 24px;
            border: 1px solid #6a3f9e;
            box-shadow: 0 0 60px rgba(106, 63, 158, 0.25);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            color: #b78cf5;
            margin-bottom: 10px;
        }

        .sub {
            color: #8b7aa8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .news-box {
            background: #120b1f;
            border-radius: 16px;
            padding: 40px 25px;
            border: 2px dashed #6a3f9e;
            margin-bottom: 25px;
        }

        .news-box .icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }

        .news-box h2 {
            color: #b78cf5;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .news-box p {
            color: #8b7aa8;
            font-size: 15px;
            line-height: 1.6;
        }

        .news-box .date {
            color: #5a4a72;
            font-size: 12px;
            margin-top: 15px;
            display: block;
        }

        .status {
            color: #5a4a72;
            font-size: 13px;
            margin-top: 10px;
        }
        .status .online {
            color: #2ecc71;
        }

        .footer {
            color: #5a4a72;
            font-size: 13px;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #6a3f9e;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }
        .btn:hover {
            background: #8b5fcf;
            transform: scale(1.02);
        }

        .links {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .links a {
            color: #b78cf5;
            text-decoration: none;
            font-size: 14px;
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid #6a3f9e;
            transition: 0.3s;
        }
        .links a:hover {
            background: #6a3f9e;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 CRASH DLC</h1>
    <div class="sub">Установи клиент и участвуй в бета-тесте</div>

    <!-- ===== НОВОСТЬ ===== -->
    <div class="news-box">
        <span class="icon">⚙️</span>
        <h2>В разработке</h2>
        <p>
            Мы работаем над новой версией CRASH DLC.<br>
            Добавляем уникальные функции и улучшаем анти-бан.
        </p>
        <span class="date">📅 30 августа 2026</span>
    </div>

    <!-- ===== СТАТУС ===== -->
    <div class="status">
        <span class="online">●</span> Сервер: <span class="online">онлайн</span>
    </div>

    <!-- ===== ССЫЛКИ ===== -->
    <div class="links">
        <a href="https://discord.gg/DanFgwuyd" target="_blank">💬 Discord</a>
        <a href="https://t.me/crashDLC" target="_blank">📲 Telegram</a>
    </div>

    <div class="footer">© 2026 CRASH DLC</div>
</div>

</body>
</html>
