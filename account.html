<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRASH DLC — Вход и Сообщество</title>
    <style>
        /* ===== ОБЩИЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f0a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #1e1233;
            padding: 40px 35px;
            border-radius: 24px;
            border: 1px solid #6a3f9e;
            box-shadow: 0 0 60px rgba(106, 63, 158, 0.25);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            font-size: 30px;
            color: #b78cf5;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            color: #b78cf5;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #3a2852;
            background: #120b1f;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #8b5fcf;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            background: #6a3f9e;
            color: #fff;
        }
        .btn:hover {
            background: #8b5fcf;
            transform: scale(1.02);
        }
        .btn-green {
            background: #2ecc71;
        }
        .btn-green:hover {
            background: #27ae60;
        }
        .btn-red {
            background: #e74c3c;
        }
        .btn-red:hover {
            background: #c0392b;
        }
        .switch {
            text-align: center;
            margin-top: 15px;
            color: #8b7aa8;
            font-size: 14px;
        }
        .switch a {
            color: #b78cf5;
            cursor: pointer;
            font-weight: 600;
        }
        #msg {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            min-height: 24px;
        }
        .hidden {
            display: none !important;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #5a4a72;
            font-size: 13px;
        }

        /* ===== СООБЩЕСТВО ===== */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #6a3f9e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
        }
        .profile-info {
            flex: 1;
        }
        .profile-info .name {
            font-size: 22px;
            font-weight: 700;
            color: #b78cf5;
        }
        .profile-info .status {
            color: #2ecc71;
            font-size: 14px;
        }
        .friend-list {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }
        .friend-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #120b1f;
            border-radius: 10px;
            margin-bottom: 6px;
            border: 1px solid #3a2852;
        }
        .friend-list .remove-btn {
            padding: 4px 14px;
            border: none;
            border-radius: 8px;
            background: #e74c3c;
            color: #fff;
            cursor: pointer;
        }
        .friend-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .friend-input input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid #3a2852;
            background: #120b1f;
            color: #fff;
            min-width: 150px;
        }
        .friend-input button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #6a3f9e;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .friend-input button:hover {
            background: #8b5fcf;
        }
        .chat-box {
            background: #120b1f;
            border-radius: 12px;
            padding: 15px;
            height: 150px;
            overflow-y: auto;
            border: 1px solid #3a2852;
            margin: 10px 0;
        }
        .chat-box .msg {
            padding: 4px 0;
            border-bottom: 1px solid #1e1233;
            font-size: 14px;
        }
        .chat-box .msg .name {
            color: #b78cf5;
            font-weight: bold;
        }
        .chat-box .msg .time {
            color: #5a4a72;
            font-size: 11px;
            margin-left: 8px;
        }
        .chat-input {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .chat-input input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid #3a2852;
            background: #120b1f;
            color: #fff;
            min-width: 150px;
        }
        .chat-input button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #6a3f9e;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        .chat-input button:hover {
            background: #8b5fcf;
        }
        .logout-btn {
            margin-top: 15px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container" id="app">

    <!-- ===== ВХОД / РЕГИСТРАЦИЯ ===== -->
    <div id="authSection">
        <h1 id="formTitle">🔐 Вход</h1>

        <div id="loginForm">
            <div class="form-group">
                <label>👤 Логин</label>
                <input type="text" id="loginName" placeholder="Введите логин">
            </div>
            <div class="form-group">
                <label>🔑 Пароль</label>
                <input type="password" id="loginPass" placeholder="Введите пароль">
            </div>
            <button class="btn" onclick="login()">Войти</button>
            <div class="switch">Нет аккаунта? <a onclick="showRegister()">Зарегистрируйся</a></div>
        </div>

        <div id="registerForm" class="hidden">
            <div class="form-group">
                <label>👤 Логин</label>
                <input type="text" id="regName" placeholder="Придумай логин">
            </div>
            <div class="form-group">
                <label>📧 Почта</label>
                <input type="email" id="regEmail" placeholder="Введи почту">
            </div>
            <div class="form-group">
                <label>🔑 Пароль</label>
                <input type="password" id="regPass" placeholder="Придумай пароль">
            </div>
            <div class="form-group">
                <label>🔁 Повтори пароль</label>
                <input type="password" id="regPass2" placeholder="Повтори пароль">
            </div>
            <button class="btn btn-green" onclick="register()">Зарегистрироваться</button>
            <div class="switch">Уже есть аккаунт? <a onclick="showLogin()">Войти</a></div>
        </div>

        <div id="msg"></div>
    </div>

    <!-- ===== СООБЩЕСТВО (показывается после входа) ===== -->
    <div id="communitySection" class="hidden">
        <div class="profile-header">
            <div class="avatar" id="profileAvatar">L</div>
            <div class="profile-info">
                <div class="name" id="profileName">Логин</div>
                <div class="status">● В сети</div>
            </div>
        </div>

        <h2 style="color:#b78cf5; font-size:18px; margin-bottom:10px;">👥 Друзья</h2>
        <div class="friend-input">
            <input type="text" id="friendInput" placeholder="Имя друга">
            <button onclick="addFriend()">➕ Добавить</button>
        </div>
        <div id="friendMsg" style="color:#8b7aa8; font-size:13px; margin-top:6px;"></div>
        <ul class="friend-list" id="friendList">
            <li style="color:#5a4a72; text-align:center; padding:15px;">У тебя пока нет друзей</li>
        </ul>

        <h2 style="color:#b78cf5; font-size:18px; margin:15px 0 10px;">💬 Общий чат</h2>
        <div class="chat-box" id="chatBox">
            <div style="color:#5a4a72; text-align:center; padding:20px;">Сообщений пока нет</div>
        </div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Введите сообщение...">
            <button onclick="sendMessage()">📤 Отправить</button>
        </div>

        <button class="btn btn-red logout-btn" onclick="logout()">🚪 Выйти</button>
    </div>

    <div class="footer">© 2026 CRASH DLC</div>

</div>

<script>
    // =======================================================
    // ===== ДАННЫЕ (хранятся в localStorage) =====
    // =======================================================

    function getUsers() {
        return JSON.parse(localStorage.getItem('users') || '[]');
    }

    function saveUsers(users) {
        localStorage.setItem('users', JSON.stringify(users));
    }

    function getChat() {
        return JSON.parse(localStorage.getItem('chatMessages') || '[]');
    }

    function saveChat(messages) {
        localStorage.setItem('chatMessages', JSON.stringify(messages));
    }

    function getFriends(username) {
        return JSON.parse(localStorage.getItem('friends_' + username) || '[]');
    }

    function saveFriends(username, friends) {
        localStorage.setItem('friends_' + username, JSON.stringify(friends));
    }

    let currentUser = null;

    // =======================================================
    // ===== АВТОРИЗАЦИЯ =====
    // =======================================================

    function showRegister() {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('formTitle').textContent = '📝 Регистрация';
        document.getElementById('msg').textContent = '';
    }

    function showLogin() {
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('formTitle').textContent = '🔐 Вход';
        document.getElementById('msg').textContent = '';
    }

    function register() {
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const pass = document.getElementById('regPass').value;
        const pass2 = document.getElementById('regPass2').value;
        const msg = document.getElementById('msg');

        if (!name || !email || !pass || !pass2) {
            msg.textContent = '❌ Заполни все поля!';
            msg.style.color = '#e74c3c';
            return;
        }
        if (pass.length < 4) {
            msg.textContent = '❌ Пароль минимум 4 символа!';
            msg.style.color = '#e74c3c';
            return;
        }
        if (pass !== pass2) {
            msg.textContent = '❌ Пароли не совпадают!';
            msg.style.color = '#e74c3c';
            return;
        }

        const users = getUsers();
        if (users.find(u => u.name === name)) {
            msg.textContent = '❌ Такой логин уже занят!';
            msg.style.color = '#e74c3c';
            return;
        }

        users.push({
            name: name,
            email: email,
            password: pass,
            date: new Date().toLocaleDateString('ru-RU')
        });
        saveUsers(users);

        msg.textContent = '✅ Регистрация успешна! Теперь войди.';
        msg.style.color = '#2ecc71';

        setTimeout(() => {
            showLogin();
            document.getElementById('loginName').value = name;
        }, 1500);
    }

    function login() {
        const name = document.getElementById('loginName').value.trim();
        const pass = document.getElementById('loginPass').value.trim();
        const msg = document.getElementById('msg');

        if (!name || !pass) {
            msg.textContent = '❌ Заполни все поля!';
            msg.style.color = '#e74c3c';
            return;
        }

        const users = getUsers();
        const user = users.find(u => u.name === name && u.password === pass);

        if (user) {
            currentUser = user;
            localStorage.setItem('currentUser', JSON.stringify(user));
            msg.textContent = '✅ Добро пожаловать, ' + name + '!';
            msg.style.color = '#2ecc71';
            showCommunity();
        } else {
            msg.textContent = '❌ Неверный логин или пароль!';
            msg.style.color = '#e74c3c';
        }
    }

    function logout() {
        localStorage.removeItem('currentUser');
        currentUser = null;
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('communitySection').classList.add('hidden');
        document.getElementById('formTitle').textContent = '🔐 Вход';
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('msg').textContent = '';
    }

    // =======================================================
    // ===== СООБЩЕСТВО =====
    // =======================================================

    function showCommunity() {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('communitySection').classList.remove('hidden');

        const avatar = document.getElementById('profileAvatar');
        const nameEl = document.getElementById('profileName');
        avatar.textContent = currentUser.name.charAt(0).toUpperCase();
        nameEl.textContent = currentUser.name;

        renderFriends();
        renderChat();
    }

    function renderFriends() {
        const list = document.getElementById('friendList');
        const friends = getFriends(currentUser.name);

        if (friends.length === 0) {
            list.innerHTML = '<li style="color:#5a4a72; text-align:center; padding:15px;">У тебя пока нет друзей</li>';
            return;
        }

        list.innerHTML = friends.map(f => `
            <li>
                <span>👤 ${f}</span>
                <button class="remove-btn" onclick="removeFriend('${f}')">✖</button>
            </li>
        `).join('');
    }

    function addFriend() {
        const input = document.getElementById('friendInput');
        const name = input.value.trim();
        const msg = document.getElementById('friendMsg');

        if (!name) {
            msg.textContent = '❌ Введи имя друга!';
            msg.style.color = '#e74c3c';
            return;
        }

        if (name === currentUser.name) {
            msg.textContent = '❌ Нельзя добавить самого себя!';
            msg.style.color = '#e74c3c';
            return;
        }

        const users = getUsers();
        if (!users.find(u => u.name === name)) {
            msg.textContent = '❌ Пользователь не найден!';
            msg.style.color = '#e74c3c';
            return;
        }

        let friends = getFriends(currentUser.name);
        if (friends.includes(name)) {
            msg.textContent = '❌ Этот друг уже есть!';
            msg.style.color = '#e74c3c';
            return;
        }

        friends.push(name);
        saveFriends(currentUser.name, friends);
        input.value = '';
        msg.textContent = '✅ Друг добавлен!';
        msg.style.color = '#2ecc71';
        renderFriends();
    }

    function removeFriend(name) {
        let friends = getFriends(currentUser.name);
        friends = friends.filter(f => f !== name);
        saveFriends(currentUser.name, friends);
        renderFriends();
    }

    // ===== ЧАТ =====

    function renderChat() {
        const box = document.getElementById('chatBox');
        const messages = getChat();

        if (messages.length === 0) {
            box.innerHTML = '<div style="color:#5a4a72; text-align:center; padding:20px;">Сообщений пока нет</div>';
            return;
        }

        box.innerHTML = messages.map(m => `
            <div class="msg">
                <span class="name">${m.name}</span>
                <span class="time">${m.time}</span>
                <div>${m.text}</div>
            </div>
        `).join('');

        box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();

        if (!text) return;

        const messages = getChat();
        messages.push({
            name: currentUser.name,
            time: new Date().toLocaleTimeString('ru-RU'),
            text: text
        });
        saveChat(messages);
        input.value = '';
        renderChat();
    }

    // =======================================================
    // ===== ENTER =====
    // =======================================================

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            // Если видна форма входа
            if (!document.getElementById('loginForm').classList.contains('hidden')) {
                login();
                return;
            }
            // Если видна форма регистрации
            if (!document.getElementById('registerForm').classList.contains('hidden')) {
                register();
                return;
            }
            // Если виден чат
            if (!document.getElementById('communitySection').classList.contains('hidden')) {
                sendMessage();
            }
        }
    });

    // =======================================================
    // ===== СТАРТ =====
    // =======================================================

    const saved = localStorage.getItem('currentUser');
    if (saved) {
        currentUser = JSON.parse(saved);
        showCommunity();
    } else {
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('communitySection').classList.add('hidden');
    }
</script>

</body>
</html>
