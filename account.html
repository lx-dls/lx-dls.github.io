<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — CRASH DLC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0a1a;
            color: #fff;
            padding: 20px;
        }

        .container {
            background: #1e1233;
            padding: 40px 35px;
            border-radius: 24px;
            border: 1px solid #6a3f9e;
            box-shadow: 0 0 60px rgba(106, 63, 158, 0.25);
            width: 100%;
            max-width: 400px;
            transition: 0.3s;
        }

        .container:hover {
            border-color: #8b5fcf;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            color: #b78cf5;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #b78cf5;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #3a2852;
            background: #120b1f;
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #8b5fcf;
            box-shadow: 0 0 20px rgba(106, 63, 158, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            background: #6a3f9e;
            color: #fff;
        }

        .btn:hover {
            background: #8b5fcf;
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(106, 63, 158, 0.3);
        }

        .btn-green {
            background: #2ecc71;
        }

        .btn-green:hover {
            background: #27ae60;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.2);
        }

        .switch {
            text-align: center;
            margin-top: 18px;
            color: #8b7aa8;
            font-size: 14px;
        }

        .switch a {
            color: #b78cf5;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }

        .switch a:hover {
            text-decoration: underline;
        }

        #msg {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            min-height: 24px;
        }

        .hidden {
            display: none !important;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #5a4a72;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1 id="formTitle">🔐 Вход</h1>

        <!-- ВХОД -->
        <div id="loginForm">
            <div class="form-group">
                <label>👤 Логин</label>
                <input type="text" id="loginName" placeholder="Введите логин">
            </div>
            <div class="form-group">
                <label>🔑 Пароль</label>
                <input type="password" id="loginPass" placeholder="Введите пароль">
            </div>
            <button class="btn" onclick="login()">Войти</button>
            <div class="switch">
                Нет аккаунта? <a onclick="showRegister()">Зарегистрируйся</a>
            </div>
        </div>

        <!-- РЕГИСТРАЦИЯ -->
        <div id="registerForm" class="hidden">
            <div class="form-group">
                <label>👤 Логин</label>
                <input type="text" id="regName" placeholder="Придумай логин">
            </div>
            <div class="form-group">
                <label>📧 Почта</label>
                <input type="email" id="regEmail" placeholder="Введи почту">
            </div>
            <div class="form-group">
                <label>🔑 Пароль</label>
                <input type="password" id="regPass" placeholder="Придумай пароль">
            </div>
            <div class="form-group">
                <label>🔁 Повтори пароль</label>
                <input type="password" id="regPass2" placeholder="Повтори пароль">
            </div>
            <button class="btn btn-green" onclick="register()">Зарегистрироваться</button>
            <div class="switch">
                Уже есть аккаунт? <a onclick="showLogin()">Войти</a>
            </div>
        </div>

        <div id="msg"></div>

        <div class="footer">© 2026 CRASH DLC</div>

    </div>

    <script>
        // ===== ПЕРЕКЛЮЧЕНИЕ ФОРМ =====
        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('formTitle').textContent = '📝 Регистрация';
            document.getElementById('msg').textContent = '';
        }

        function showLogin() {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('formTitle').textContent = '🔐 Вход';
            document.getElementById('msg').textContent = '';
        }

        // ===== РЕГИСТРАЦИЯ =====
        function register() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;
            const pass2 = document.getElementById('regPass2').value;
            const msg = document.getElementById('msg');

            if (!name || !email || !pass || !pass2) {
                msg.textContent = '❌ Заполни все поля!';
                msg.style.color = '#e74c3c';
                return;
            }

            if (pass.length < 4) {
                msg.textContent = '❌ Пароль минимум 4 символа!';
                msg.style.color = '#e74c3c';
                return;
            }

            if (pass !== pass2) {
                msg.textContent = '❌ Пароли не совпадают!';
                msg.style.color = '#e74c3c';
                return;
            }

            const users = JSON.parse(localStorage.getItem('users') || '[]');

            if (users.find(u => u.name === name)) {
                msg.textContent = '❌ Такой логин уже занят!';
                msg.style.color = '#e74c3c';
                return;
            }

            users.push({
                name: name,
                email: email,
                password: pass,
                date: new Date().toLocaleDateString('ru-RU')
            });

            localStorage.setItem('users', JSON.stringify(users));

            msg.textContent = '✅ Регистрация успешна! Теперь войди.';
            msg.style.color = '#2ecc71';

            setTimeout(() => {
                showLogin();
                document.getElementById('loginName').value = name;
            }, 1500);
        }

        // ===== ВХОД =====
        function login() {
            const name = document.getElementById('loginName').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const msg = document.getElementById('msg');

            if (!name || !pass) {
                msg.textContent = '❌ Заполни все поля!';
                msg.style.color = '#e74c3c';
                return;
            }

            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const user = users.find(u => u.name === name && u.password === pass);

            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                msg.textContent = '✅ Вход выполнен! Перенаправление...';
                msg.style.color = '#2ecc71';

                setTimeout(() => {
                    window.location.href = 'https://lxneoorig.github.io/lxneoorig/main.html';
                }, 1000);
            } else {
                msg.textContent = '❌ Неверный логин или пароль!';
                msg.style.color = '#e74c3c';
            }
        }

        // ===== ENTER =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (!document.getElementById('loginForm').classList.contains('hidden')) {
                    login();
                } else {
                    register();
                }
            }
        });

        // ===== ЕСЛИ УЖЕ ВОШЁЛ =====
        if (localStorage.getItem('currentUser')) {
            window.location.href = 'https://lxneoorig.github.io/lxneoorig/main.html';
        }
    </script>

</body>
</html>
